name: Feature request
description: Propose a change to Relay.
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Explain who needs this change and what they cannot do today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful change and any alternatives you considered.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Deployment or privacy impact
      description: Note any new service, credential, data storage, or change to Relay's single-operator scope.
